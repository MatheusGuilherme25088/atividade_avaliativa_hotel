<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hotel Reservas - Cadastro de Quarto</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <aside class="sidebar">
    <div class="logo">
      <span class="icon">🏨</span>
      <span>Hotel Reservas</span>
    </div>
    <nav>
      <a href="index.html" class="active">🏠 Quartos</a>
      <a href="index.html">📅 Reservas</a>
      <a href="sobre.html">ℹ️ Sobre</a>
    </nav>
    <div class="footer">© 2024 Hotel Reservas - Projeto Full Stack</div>
  </aside>

  <main>
    <div class="form-card">
      <h2>Cadastro de Quarto</h2>
      <p class="subtitle">Informe os dados do novo quarto</p>

      <form id="formQuarto">
        <div class="field">
          <label for="numero">Número do Quarto</label>
          <input type="text" id="numero" placeholder="Ex: 101" required>
        </div>

        <div class="field">
          <label for="tipo">Tipo do Quarto</label>
          <select id="tipo" required>
            <option value="" disabled selected>Selecione o tipo</option>
            <option value="Standard">Standard</option>
            <option value="Luxo">Luxo</option>
            <option value="Suíte">Suíte</option>
          </select>
        </div>

        <button type="submit" class="btn btn-primary btn-block" style="margin-bottom: 10px;">💾 Cadastrar</button>
        <a href="index.html" class="btn btn-secondary btn-block">Voltar</a>
      </form>
    </div>
  </main>

  <script src="api.js"></script>
  <script>
    document.getElementById('formQuarto').addEventListener('submit', async (e) => {
      e.preventDefault();
      const numero = document.getElementById('numero').value.trim();
      const tipo = document.getElementById('tipo').value;

      if (!numero || !tipo) {
        alert('Preencha todos os campos.');
        return;
      }

      try {
        await apiPost('/quartos', { numero, tipo });
        window.location.href = 'index.html';
      } catch (e) {
        alert('Erro ao cadastrar quarto: ' + e.message);
      }
    });
  </script>
</body>
</html>
